[project]
name = "quadra"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.159",
    "nicegui>=3.18",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "supabase>=2.33",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
main_file = "tests/ui/ui_main.py"
addopts = "-p nicegui.testing.user_plugin -m 'not integration' --import-mode=importlib"
markers = ["integration: needs real Supabase (.env with SUPABASE_URL/SUPABASE_SECRET_KEY) - run with -m integration"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Tooling/planning trees hold markdown with illustrative Python snippets, not project code.
extend-exclude = [".claude", ".planning", ".gsd"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
